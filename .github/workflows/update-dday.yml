name: Update developer D-Day

on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update D-Day
        run: |
          python - <<'PY'
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          days = (datetime.now(ZoneInfo("Asia/Seoul")).date() - date(2026, 6, 22)).days
          replacement = f"<!-- dday:start -->\n🌱 개발자로 성장한 지 **D+{days}**\n<!-- dday:end -->"
          updated = re.sub(r"<!-- dday:start -->.*?<!-- dday:end -->", replacement, text, flags=re.DOTALL)
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update developer D-Day"
          git push
